name: Verify authentication feature
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: test -z "$(gofmt -l .)"
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: infrastructure/go.mod
          cache-dependency-path: infrastructure/go.sum
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
